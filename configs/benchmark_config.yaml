# ProtLigGNN Benchmark Configuration
# Target hardware classification: GPU CUDA 12.1 Enabled

# Dataset & Splits
dataset_version: "pdbbind2020_local"
split_strategy: "random"
val_fraction: 0.1
test_fraction: 0.1
max_samples: 1000

# Training Hyperparameters
epochs: 40
batch_size: 8
lr: 0.001
weight_decay: 0.00001
patience: 10

# Hardware & Performance
device: "cuda"
num_workers: 0
pin_memory: false
precision: "float32"

# Infrastructure & Reporting
checkpoint_interval: 1
evaluation_interval: 1
benchmark_version: "Validated Baseline v0.95"
allow_duplicate: true
log_level: "INFO"
